<script>
document.addEventListener('DOMContentLoaded',function(){
  function bEvent(name,params){
    if(typeof gtag==='function'){gtag('event',name,params||{});}
  }
  document.querySelectorAll('a[href^="tel:"]').forEach(function(a){
    a.addEventListener('click',function(){
      bEvent('click_to_call',{link_url:a.getAttribute('href'),page_location:location.href});
    });
  });
  document.querySelectorAll('a[href^="mailto:"]').forEach(function(a){
    a.addEventListener('click',function(){
      bEvent('click_to_email',{link_url:a.getAttribute('href'),page_location:location.href});
    });
  });
  document.querySelectorAll('a').forEach(function(a){
    var h=(a.getAttribute('href')||'').toLowerCase();
    var t=(a.textContent||'').toLowerCase().trim();
    if(h.indexOf('/get-quote')!==-1 || t.indexOf('get quote')!==-1 ||
       t.indexOf('request a quote')!==-1 || t.indexOf('free quote')!==-1){
      a.addEventListener('click',function(){
        bEvent('quote_request_click',{link_url:a.getAttribute('href'),page_location:location.href});
      });
    }
  });
  document.querySelectorAll('form').forEach(function(f){
    f.addEventListener('submit',function(){
      var sig=((f.getAttribute('action')||'')+' '+(f.id||'')+' '+(f.getAttribute('name')||'')+' '+(f.className||'')+' '+location.pathname).toLowerCase();
      if(sig.indexOf('quote')!==-1 || sig.indexOf('contact')!==-1){
        bEvent('generate_lead',{form_id:f.id||'',page_location:location.href});
      }
    });
  });
});
</script>
<!-- /Bakerss conversion measurement -->
