<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get a Free Quote | Bakerss Property Maintenance — Myrtle Beach SC</title>
<meta name="description" content="Get a personalized property maintenance estimate in 60 seconds. Myrtle Beach and Horry County SC.">
<link rel="canonical" href="https://www.bakerss.com/get-quote/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#E91E8C;--black:#0D0D0D;--dark:#1A1A1A;--d2:#222;--d3:#2a2a2a;--border:rgba(255,255,255,0.09);--text:rgba(255,255,255,0.88);--muted:rgba(255,255,255,0.42);--radius:10px}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--black);color:var(--text);min-height:100vh;line-height:1.6}

/* TOP BAR */
.topbar{background:var(--dark);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:600;color:var(--text);text-decoration:none}
.logo em{font-style:normal;color:var(--pink)}
.call-btn{font-size:13px;font-weight:500;color:var(--pink);text-decoration:none;border:1px solid rgba(233,30,140,0.3);padding:7px 15px;border-radius:20px;background:rgba(233,30,140,0.07);transition:background .2s}
.call-btn:hover{background:rgba(233,30,140,0.14)}

/* LAYOUT */
.page{padding:28px 16px 64px;display:flex;flex-direction:column;align-items:center}

/* PROGRESS */
.prog-wrap{width:100%;max-width:560px;margin-bottom:24px}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.prog-track{height:3px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--pink);border-radius:3px;transition:width .4s ease}
.dots{display:flex;gap:5px;justify-content:center;margin-top:9px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.1);transition:all .3s}
.dot.done{background:rgba(233,30,140,0.32)}
.dot.active{background:var(--pink);width:18px;border-radius:4px}

/* CARD */
.card{background:var(--d2);border:1px solid var(--border);border-radius:16px;padding:26px 22px 20px;width:100%;max-width:560px;transition:opacity .22s}

.step-lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);display:block;margin-bottom:6px}
.card h2{font-size:19px;font-weight:600;color:var(--text);margin-bottom:5px;line-height:1.2}
.card .sub{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.55;font-weight:300}

/* OPTIONS */
.opts{display:grid;gap:8px;margin-bottom:16px}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}

.opt{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;cursor:pointer;text-align:left;width:100%;color:inherit;font-family:inherit;transition:border-color .15s,background .15s}
.opt:hover{border-color:rgba(233,30,140,.4);background:rgba(233,30,140,.05)}
.opt.sel{border-color:var(--pink);background:rgba(233,30,140,.09)}
.ico{font-size:19px;width:28px;text-align:center;flex-shrink:0}
.txt{flex:1;min-width:0}
.t1{display:block;font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.ck{width:17px;height:17px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:all .15s}
.opt.sel .ck{background:var(--pink);border-color:var(--pink);color:#fff}

/* NAV */
.nav-row{display:flex;gap:9px;align-items:center;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06);margin-top:6px}
.btn-back{background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0}
.btn-back:hover{border-color:rgba(255,255,255,0.25);color:var(--text)}
.btn-next{flex:1;background:var(--pink);color:#fff;border:none;padding:11px 20px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;box-shadow:0 4px 16px rgba(233,30,140,.25)}
.btn-next:disabled{opacity:.28;cursor:not-allowed;box-shadow:none}
.btn-next:not(:disabled):hover{opacity:.86}

.skip{font-size:12px;color:rgba(255,255,255,0.22);text-align:center;margin-top:10px;cursor:pointer;text-decoration:underline;display:block}
.skip:hover{color:var(--muted)}

/* FIELDS */
.field{margin-bottom:11px}
.field label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field label span{color:var(--pink)}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;font-size:14px;font-family:inherit;color:var(--text);background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius);outline:none;transition:border-color .18s}
.field input:focus,.field textarea:focus{border-color:rgba(233,30,140,.5)}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,0.18)}
.field select{cursor:pointer;-webkit-appearance:none}
.field textarea{resize:vertical;min-height:70px}

/* URGENCY */
.urgency{width:100%;max-width:560px;margin-top:12px;background:rgba(233,30,140,.04);border:1px solid rgba(233,30,140,.14);border-radius:var(--radius);padding:11px 14px;display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--muted)}
.pulse{color:var(--pink);animation:pulse 2s infinite;flex-shrink:0;margin-top:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* RESULT */
.result-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(233,30,140,.09);border:1px solid rgba(233,30,140,.25);border-radius:100px;padding:3px 12px;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--pink);margin-bottom:12px}
.est-range{font-size:40px;font-weight:700;color:var(--pink);letter-spacing:-.02em;line-height:1}
.est-unit{font-size:13px;color:var(--muted);margin:4px 0 18px}
.est-table{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);padding:10px 14px;margin-bottom:16px}
.est-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,0.05)}
.est-row:last-child{border:none}
.est-row .ek{color:var(--muted)}
.est-row .ev{color:var(--text);font-weight:500}
.est-row .ev.pk{color:var(--pink)}
.cta-row{display:flex;gap:9px;margin-top:4px}
.big-call{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--pink);color:#fff;padding:13px;border-radius:var(--radius);font-size:14px;font-weight:600;text-decoration:none;transition:opacity .15s}
.big-call:hover{opacity:.86}
.big-sms{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;color:var(--text);border:1px solid var(--border);padding:13px;border-radius:var(--radius);font-size:14px;font-weight:500;text-decoration:none;transition:border-color .15s}
.big-sms:hover{border-color:rgba(255,255,255,0.3)}
.confirm{margin-top:12px;padding:10px 13px;background:rgba(255,255,255,0.03);border-radius:var(--radius);font-size:12px;color:var(--muted);line-height:1.55}
.tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.06)}
.tag{font-size:12px;color:var(--muted);text-decoration:none;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:4px 11px;border-radius:100px;transition:color .15s}
.tag:hover{color:var(--text)}
.tag.pk{color:var(--pink);background:rgba(233,30,140,.07);border-color:rgba(233,30,140,.2)}

@media(max-width:480px){.g2{grid-template-columns:1fr}.cta-row{flex-direction:column}}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="logo">Bakerss<em>.</em></a>
  <a href="tel:8434677136" class="call-btn">&#128222; 843-467-7136</a>
</div>

<div class="page">
  <div class="prog-wrap" id="prog">
    <div class="prog-meta"><span id="slbl">Step 1 of 5</span><span id="spct">20%</span></div>
    <div class="prog-track"><div class="prog-fill" id="pfill" style="width:20%"></div></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="card" id="card"></div>
  <div class="urgency" id="urgency">
    <span class="pulse">&#9679;</span>
    <span>Ray is available now. Most requests get a same-day estimate &#8212; call <a href="tel:8434677136" style="color:var(--pink);font-weight:600;text-decoration:none">843-467-7136</a> for the fastest response.</span>
  </div>
</div>

<form name="funnel-quote" netlify style="display:none">
  <input name="name"><input name="phone"><input name="email">
  <input name="address"><input name="service"><input name="proptype">
  <input name="propsize"><input name="timing"><input name="notes">
</form>

<script>
var T=5,S={step:0,sel:{},c:{}};
var PR={
  'lawn-care':{lo:50,hi:90,u:'per visit',n:'Lawn Care'},
  'pressure-washing':{lo:125,hi:500,u:'per service',n:'Pressure Washing'},
  'gutter-cleaning':{lo:99,hi:225,u:'per cleaning',n:'Gutter Cleaning'},
  'airbnb-cleaning':{lo:100,hi:350,u:'per turnover',n:'Airbnb / STR Cleaning'},
  'interior-cleaning':{lo:100,hi:295,u:'per visit',n:'Interior Cleaning'},
  'painting':{lo:1800,hi:9000,u:'project',n:'Painting'},
  'landscaping':{lo:300,hi:4500,u:'project',n:'Landscaping'},
  'concrete-curbing':{lo:160,hi:1050,u:'project',n:'Concrete Curbing'},
  'deck-building':{lo:4000,hi:15000,u:'project',n:'Deck Building & Repair'},
  'flooring':{lo:1200,hi:9000,u:'project',n:'Flooring'},
  'handyman':{lo:75,hi:550,u:'per visit',n:'Handyman Services'},
  'minor-electric':{lo:75,hi:275,u:'per repair',n:'Minor Electrical & Plumbing'},
  'junk-removal':{lo:99,hi:650,u:'per load',n:'Junk Removal'},
  'property-plan':{lo:150,hi:900,u:'per month',n:'Property Maintenance Plan'},
  'commercial-cleaning':{lo:200,hi:800,u:'per month',n:'Commercial Cleaning'}
};
var SM={small:.8,standard:1,large:1.3,estate:1.7};
var STEPS=[
  {key:'service',tag:'Step 1 of 5',h:'Which service do you need?',sub:'Select your primary service. You can mention others at the end.',cols:2,
   opts:[
    {v:'lawn-care',i:'&#127807;',t:'Lawn Care',s:'Mowing, edging, trimming'},
    {v:'pressure-washing',i:'&#128167;',t:'Pressure Washing',s:'Driveway, siding, decks'},
    {v:'gutter-cleaning',i:'&#127810;',t:'Gutter Cleaning',s:'Remove debris & flush'},
    {v:'airbnb-cleaning',i:'&#127958;',t:'Airbnb / STR Cleaning',s:'Vacation rental turnover'},
    {v:'interior-cleaning',i:'&#127968;',t:'Interior Cleaning',s:'Recurring, deep, move-in/out'},
    {v:'painting',i:'&#127912;',t:'Painting',s:'Interior or exterior'},
    {v:'landscaping',i:'&#127802;',t:'Landscaping',s:'Design, plants, curbing'},
    {v:'flooring',i:'&#129717;',t:'Flooring',s:'LVP, tile, hardwood'},
    {v:'handyman',i:'&#128295;',t:'Handyman Services',s:'Repairs & installations'},
    {v:'deck-building',i:'&#127959;',t:'Deck Building & Repair',s:'New build or restoration'},
    {v:'junk-removal',i:'&#128666;',t:'Junk Removal',s:'Estate cleanouts & debris'},
    {v:'property-plan',i:'&#128203;',t:'Maintenance Plan',s:'All services bundled monthly'},
    {v:'minor-electric',i:'&#9889;',t:'Electrical & Plumbing',s:'Minor repairs & installs'},
    {v:'commercial-cleaning',i:'&#127970;',t:'Commercial Cleaning',s:'Restaurants, offices, retail'}
   ]},
  {key:'propType',tag:'Step 2 of 5',h:'What type of property?',sub:'Helps us tailor the estimate to the right scope and schedule.',cols:2,
   opts:[
    {v:'primary',i:'&#127969;',t:'Primary Residence',s:'My main home'},
    {v:'str',i:'&#127958;',t:'Vacation Rental / Airbnb',s:'STR on the Grand Strand'},
    {v:'second',i:'&#9992;&#65039;',t:'Second Home / Snowbird',s:'Part-time or seasonal'},
    {v:'hoa',i:'&#127960;',t:'HOA Community Home',s:'Governed community'},
    {v:'investment',i:'&#128176;',t:'Investment Property',s:'Rental or rehab project'},
    {v:'commercial',i:'&#127970;',t:'Commercial Property',s:'Business or office'}
   ]},
  {key:'propSize',tag:'Step 3 of 5',h:'How large is the property?',sub:"Directly affects pricing. Best guess is fine \u2014 we confirm on-site.",cols:2,
   opts:[
    {v:'small',i:'&#127968;',t:'Small',s:'Condo, cottage, under 1,200 sq ft'},
    {v:'standard',i:'&#127969;',t:'Standard',s:'3\u20134 bed home, typical lot'},
    {v:'large',i:'&#127960;',t:'Large',s:'5+ bedrooms or larger lot'},
    {v:'estate',i:'&#127968;',t:'Estate / Commercial',s:'Large acreage or commercial scale'}
   ]},
  {key:'timing',tag:'Step 4 of 5',h:'When do you need this?',sub:'Helps us plan availability and check our schedule.',cols:2,dynamic:true},
  {key:'contact',tag:'Step 5 of 5',h:'Where should we send your estimate?',sub:'Ray or Courtney respond personally \u2014 usually within the hour. No spam, no scripts.',type:'contact'}
];

function tOpts(){
  var r=['lawn-care','gutter-cleaning','interior-cleaning','airbnb-cleaning','property-plan','commercial-cleaning'];
  if(r.indexOf(S.sel.service)>=0)return[
    {v:'weekly',i:'&#128197;',t:'Weekly',s:'Ongoing weekly service'},
    {v:'biweekly',i:'&#128197;',t:'Biweekly',s:'Every two weeks'},
    {v:'monthly',i:'&#128197;',t:'Monthly',s:'Once a month'},
    {v:'onetime',i:'&#127919;',t:'One-Time',s:'Just this visit'}
  ];
  return[
    {v:'asap',i:'&#9889;',t:'As Soon as Possible',s:'Need this done quickly'},
    {v:'thisweek',i:'&#128197;',t:'This Week',s:'Within 7 days'},
    {v:'thismonth',i:'&#128198;',t:'This Month',s:'Within 30 days'},
    {v:'planning',i:'&#128199;',t:'Planning Ahead',s:'Gathering estimates'}
  ];
}

function calc(){
  var svc=S.sel.service;
  if(!svc||!PR[svc])return{lo:'$?',hi:'$?',u:'',n:'Your Service'};
  var p=PR[svc],m=SM[S.sel.propSize]||1;
  var lo=Math.round(p.lo*m),hi=Math.round(p.hi*m);
  if(S.sel.propType==='commercial'){lo=Math.round(lo*1.2);hi=Math.round(hi*1.3);}
  if(S.sel.propType==='str'&&['airbnb-cleaning','interior-cleaning','lawn-care','pressure-washing'].indexOf(svc)>=0){lo=Math.round(lo*1.05);hi=Math.round(hi*1.1);}
  lo=Math.ceil(lo/5)*5;hi=Math.ceil(hi/10)*10;
  function f(n){return n>=1000?'$'+(n/1000).toFixed(1).replace('.0','')+'K':'$'+n;}
  return{lo:f(lo),hi:f(hi),u:p.u,n:p.n};
}

function rp(){
  var pct=Math.round(((S.step+1)/T)*100);
  document.getElementById('slbl').textContent='Step '+(S.step+1)+' of '+T;
  document.getElementById('spct').textContent=pct+'%';
  document.getElementById('pfill').style.width=pct+'%';
  var d='';for(var i=0;i<T;i++){var c='dot';if(i<S.step)c+=' done';else if(i===S.step)c+=' active';d+='<div class="'+c+'"></div>';}
  document.getElementById('dots').innerHTML=d;
}

function render(){
  rp();
  var step=STEPS[S.step];
  if(step.dynamic)step.opts=tOpts();
  var card=document.getElementById('card');
  card.style.opacity='0';
  setTimeout(function(){
    card.innerHTML=step.type==='contact'?bC(step):bO(step);
    card.style.opacity='1';
  },75);
}

function bO(step){
  var cols=step.cols===1?'g1':'g2',cur=S.sel[step.key]||'',items='';
  step.opts.forEach(function(o){
    var s=cur===o.v?'sel':'';
    items+='<button class="opt '+s+'" onclick="pick(\''+step.key+'\',\''+o.v+'\',this)">'
      +'<span class="ico">'+o.i+'</span>'
      +'<span class="txt"><span class="t1">'+o.t+'</span><span class="t2">'+o.s+'</span></span>'
      +'<span class="ck">&#10003;</span></button>';
  });
  var back=S.step>0?'<button class="btn-back" onclick="go(-1)">&#8592; Back</button>':'<span></span>';
  var lbl=S.step<T-1?'Continue &#8594;':'Get My Estimate &#8594;';
  var dis=cur?'':'disabled';
  return'<span class="step-lbl">'+step.tag+'</span>'
    +'<h2>'+step.h+'</h2><p class="sub">'+step.sub+'</p>'
    +'<div class="opts '+cols+'">'+items+'</div>'
    +'<div class="nav-row">'+back
    +'<button class="btn-next" id="nb" '+dis+' onclick="go(1)">'+lbl+'</button>'
    +'</div>'
    +'<span class="skip" onclick="skipTo()">Skip &#8212; just connect me with Ray</span>';
}

function bC(step){
  var c=S.c;
  return'<span class="step-lbl">'+step.tag+'</span>'
    +'<h2>'+step.h+'</h2><p class="sub">'+step.sub+'</p>'
    +'<div class="field"><label>Your Name <span>*</span></label><input type="text" id="fn" placeholder="First and last name" value="'+(c.name||'')+'" oninput="sc()"></div>'
    +'<div class="field"><label>Phone Number <span>*</span></label><input type="tel" id="fp" placeholder="(843) 000-0000" value="'+(c.phone||'')+'" oninput="sc()"></div>'
    +'<div class="field"><label>Email Address</label><input type="email" id="fe" placeholder="your@email.com" value="'+(c.email||'')+'" oninput="sc()"></div>'
    +'<div class="field"><label>Property Address or City</label><input type="text" id="fa" placeholder="e.g. Myrtle Beach SC" value="'+(c.address||'')+'" oninput="sc()"></div>'
    +'<div class="field"><label>Anything else we should know?</label><textarea id="fnotes" placeholder="Details, questions, timing..." oninput="sc()">'+(c.notes||'')+'</textarea></div>'
    +'<div class="nav-row"><button class="btn-back" onclick="go(-1)">&#8592; Back</button>'
    +'<button class="btn-next" id="nb" disabled onclick="showResult()">Get My Free Estimate &#8594;</button></div>';
}

function pick(key,val,btn){
  document.querySelectorAll('.opt').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel');S.sel[key]=val;
  var nb=document.getElementById('nb');if(nb)nb.disabled=false;
}

function go(dir){
  if(dir===1&&S.step<T-1){S.step++;render();}
  else if(dir===-1&&S.step>0){S.step--;render();}
  window.scrollTo({top:0,behavior:'smooth'});
}

function skipTo(){S.step=T-1;render();window.scrollTo({top:0,behavior:'smooth'});}

function sc(){
  S.c.name=(document.getElementById('fn')||{}).value||'';
  S.c.phone=(document.getElementById('fp')||{}).value||'';
  S.c.email=(document.getElementById('fe')||{}).value||'';
  S.c.address=(document.getElementById('fa')||{}).value||'';
  S.c.notes=(document.getElementById('fnotes')||{}).value||'';
  var nb=document.getElementById('nb');
  if(nb)nb.disabled=!(S.c.name.trim()&&S.c.phone.trim());
}

function showResult(){
  sc();
  document.getElementById('prog').style.display='none';
  document.getElementById('urgency').style.display='none';
  var est=calc();
  var so=STEPS[0].opts.find(function(o){return o.v===S.sel.service;});
  var svcN=so?so.t:est.n;
  var nm=(S.c.name||'there').split(' ')[0];
  var cnt=S.c.phone||S.c.email||'your contact info';
  var TL={primary:'Primary Residence',str:'Vacation Rental / Airbnb',second:'Second Home',hoa:'HOA Community',investment:'Investment Property',commercial:'Commercial Property'};
  var SL={small:'Small',standard:'Standard',large:'Large',estate:'Estate / Commercial'};
  var TM={weekly:'Weekly',biweekly:'Biweekly',monthly:'Monthly',onetime:'One-Time',asap:'ASAP',thisweek:'This Week',thismonth:'This Month',planning:'Planning Ahead'};
  var SL2={'lawn-care':'lawn-care','pressure-washing':'pressure-washing','gutter-cleaning':'gutter-cleaning','airbnb-cleaning':'airbnb-cleaning','interior-cleaning':'interior-cleaning','painting':'painting','landscaping':'landscaping','concrete-curbing':'concrete-curbing','deck-building':'deck-building-repair','flooring':'flooring','handyman':'handyman-services','minor-electric':'minor-electric-plumbing','junk-removal':'junk-removal','property-plan':'property-maintenance','commercial-cleaning':'commercial-cleaning'};
  var slug=SL2[S.sel.service]||'';
  var card=document.getElementById('card');
  card.style.opacity='0';
  setTimeout(function(){
    card.innerHTML='<div style="text-align:center">'
      +'<div class="result-badge">&#10003; Your Personalized Estimate</div>'
      +'<p style="font-size:13.5px;color:var(--muted);margin-bottom:5px">Hey '+nm+'! Based on your answers:</p>'
      +'<div class="est-range">'+est.lo+' &#8211; '+est.hi+'</div>'
      +'<p class="est-unit">'+est.u+' &middot; '+svcN+'</p>'
      +'</div>'
      +'<div class="est-table">'
      +'<div class="est-row"><span class="ek">Service</span><span class="ev">'+svcN+'</span></div>'
